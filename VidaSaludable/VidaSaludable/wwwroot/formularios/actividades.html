<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Actividades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="bg-green-100 font-sans">

    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-semibold text-green-700">Gestión de Actividades</h1>

        <div class="mb-4">
            <nav class="flex items-center space-x-2 text-lg text-gray-700">
                <a href="https://localhost:7190/index.html" class="text-green-600 hover:text-green-500 font-semibold">
                    <i class="fas fa-home mr-2"></i> Dashboard
                </a>
                <span>/</span>
                <span class="text-gray-500" id="pageTitle">Actividades</span>
            </nav>
        </div>

        <!-- Botón para añadir actividad -->
        <button onclick="mostrarFormulario('crear')" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-500 mt-4">
            Añadir Actividad
        </button>

        <!-- Formulario para añadir actividad -->
        <div id="modalCrear" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden justify-center items-center">
            <div class="bg-white p-8 rounded shadow-lg w-1/3 h-full overflow-auto">
                <h2 class="text-2xl text-green-700 mb-4">Añadir Dieta</h2>

                <form id="formNuevaActividad" class="space-y-4">
                    <div>
                        <label for="descripcionCrear" class="block text-lg text-gray-700">Descripción</label>
                        <input type="text" id="descripcionCrear" name="descripcion" class="w-full p-2 mt-2 border border-gray-300 rounded" required>
                    </div>

                    <div>
                        <label for="fechaInicioCrear" class="block text-lg text-gray-700">Fecha de Inicio</label>
                        <input type="date" id="fechaInicioCrear" name="fechaInicio" class="w-full p-2 mt-2 border border-gray-300 rounded" required>
                    </div>

                    <button type="submit" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-500">
                        Guardar
                    </button>
                    <button type="button" onclick="ocultarFormulario('crear')" class="w-full bg-red-500 text-white p-2 rounded hover:bg-red-400">
                        Cancelar
                    </button>
                </form>
            </div>
        </div>

        <!-- Formulario para editar actividad -->
        <div id="formEditar" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden justify-center items-center">
            <div class="bg-white p-8 rounded shadow-lg w-1/3 h-full overflow-auto">
                <h2 class="text-2xl text-green-700 mb-4">Editar Dieta</h2>

                <form id="formEditarActividad" class="space-y-4">
                    <div>
                        <label for="descripcionEditar" class="block text-lg text-gray-700">Descripción</label>
                        <input type="text" id="descripcionEditar" name="descripcion" class="w-full p-2 mt-2 border border-gray-300 rounded" required>
                    </div>

                    <div>
                        <label for="fechaInicioEditar" class="block text-lg text-gray-700">Fecha de Inicio</label>
                        <input type="date" id="fechaInicioEditar" name="fechaInicio" class="w-full p-2 mt-2 border border-gray-300 rounded" required>
                    </div>

                    <button type="submit" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-500">
                        Guardar Cambios
                    </button>
                    <button type="button" onclick="ocultarFormulario('editar')" class="w-full bg-red-500 text-white p-2 rounded hover:bg-red-400">
                        Cancelar
                    </button>
                </form>
            </div>
        </div>

        <!-- Lista de actividades -->
        <div class="mt-6">
            <h2 class="text-2xl text-green-700 mb-4">Lista de Actividades</h2>
            <ul id="listaActividades" class="space-y-4"></ul>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('usuario'));

        window.onload = async function () {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                obtenerActividades();
            }
        };

        function mostrarFormulario(tipo) {
            document.getElementById(tipo === 'crear' ? 'modalCrear' : 'formEditar').classList.remove('hidden');
        }

        function ocultarFormulario(tipo) {
            document.getElementById(tipo === 'crear' ? 'modalCrear' : 'formEditar').classList.add('hidden');
            limpiarFormulario(tipo);
        }

        function obtenerActividades() {
            fetch(`https://localhost:7190/api/actividades/usuario/${user.id}`)
                .then(response => response.json())
                .then(data => {
                    const lista = document.getElementById('listaActividades');
                    lista.innerHTML = '';

                    data.forEach(actividad => {
                        const li = document.createElement('li');
                        li.classList.add('bg-white', 'p-4', 'rounded', 'shadow', 'flex', 'justify-between', 'items-center');
                        li.innerHTML = `
                                <div>
                                    <p class="text-xl text-green-800">${actividad.descripcion}</p>
                                    <p class="text-sm text-gray-600">Fecha Inicio: ${new Date(actividad.fechaInicio).toLocaleString()}</p>
                                    <p class="text-sm text-gray-600">Estado: ${actividad.estado}</p>
                                </div>
                                <div class="space-x-2">
                                    <button onclick="prepararEdicion(${actividad.id})" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-400">Editar</button>
                                    <button onclick="eliminarActividad(${actividad.id})" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-400">Eliminar</button>
                                </div>
                            `;
                        lista.appendChild(li);
                    });
                });
        }

        document.getElementById('formNuevaActividad').addEventListener('submit', function (event) {
            event.preventDefault();

            const actividad = {
                usuarioId: user.id,
                descripcion: document.getElementById('descripcionCrear').value,
                fechaInicio: document.getElementById('fechaInicioCrear').value,
                estado: 'Activa'
            };

            fetch('https://localhost:7190/api/actividades', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(actividad)
            }).then(() => {
                obtenerActividades();
                ocultarFormulario('crear');
            });
        });

        document.getElementById('formEditarActividad').addEventListener('submit', function (event) {
            event.preventDefault();

            const actividad = {
                usuarioId: user.id,
                descripcion: document.getElementById('descripcionEditar').value,
                fechaInicio: document.getElementById('fechaInicioEditar').value,
                estado: 'Activa'
            };

            fetch(`https://localhost:7190/api/actividades/${actividadEditarId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(actividad)
            }).then(() => {
                obtenerActividades();
                ocultarFormulario('editar');
            });
        });

        let actividadEditarId = null;

        function prepararEdicion(id) {
            actividadEditarId = id;
            fetch(`https://localhost:7190/api/actividades/${id}`)
                .then(response => response.json())
                .then(actividad => {
                    document.getElementById('descripcionEditar').value = actividad.descripcion;
                    document.getElementById('fechaInicioEditar').value = actividad.fechaInicio.split('T')[0];
                    mostrarFormulario('editar');
                });
        }

        function eliminarActividad(id) {
            fetch(`https://localhost:7190/api/actividades/${id}`, { method: 'DELETE' })
                .then(() => obtenerActividades());
        }

        function limpiarFormulario(tipo) {
            document.getElementById(tipo === 'crear' ? 'formNuevaActividad' : 'formEditarActividad').reset();
        }
    </script>
</body>
</html>
