<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Actividades</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-100 font-sans">

    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-semibold text-blue-700">Gestión de Actividades</h1>

        <!-- Formulario para añadir actividades -->
        <div id="formularioActividades" class="mt-4 p-4 bg-white rounded shadow-lg relative">
            <button onclick="cerrarFormulario()" class="absolute top-2 right-2 text-red-500 hover:text-red-700 text-lg font-bold">&times;</button>
            <form id="formActividad">
                <div class="mb-4">
                    <label for="descripcion" class="block text-lg text-gray-700">Descripción</label>
                    <input type="text" id="descripcion" class="w-full p-2 mt-2 border border-gray-300 rounded" required>
                </div>

                <div class="mb-4">
                    <label for="fechaInicio" class="block text-lg text-gray-700">Fecha de Inicio</label>
                    <input type="datetime-local" id="fechaInicio" class="w-full p-2 mt-2 border border-gray-300 rounded" required>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-500">
                    Añadir Actividad
                </button>
            </form>
        </div>

        <div class="mt-6">
            <h2 class="text-2xl text-blue-700 mb-4">Lista de Actividades</h2>
            <ul id="listaActividades" class="space-y-4"></ul>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('usuario'));

        // Verificar si el usuario está logueado
        window.onload = async function () {
            if (!user) {
                window.location.href = 'login.html'; // Si no hay usuario, redirige al login
            } else {
                obtenerActividades(); // Si está logueado, carga las actividades
            }
        };

        // Obtener todas las actividades
        function obtenerActividades() {
            fetch(`https://localhost:7190/api/actividades/usuario/${user.id}`)
                .then(response => response.json())
                .then(data => {
                    const listaActividades = document.getElementById('listaActividades');
                    listaActividades.innerHTML = ''; // Limpiar la lista actual

                    data.forEach(actividad => {
                        const li = document.createElement('li');
                        li.classList.add('bg-white', 'p-4', 'rounded', 'shadow', 'flex', 'justify-between', 'items-center');

                        li.innerHTML = `
                            <div>
                                <p class="text-xl text-blue-800">${actividad.descripcion}</p>
                                <p class="text-sm text-gray-600">Fecha Inicio: ${new Date(actividad.fechaInicio).toLocaleString()}</p>
                                <p class="text-sm text-gray-600">Estado: ${actividad.estado}</p>
                            </div>
                            <div class="space-x-2">
                                <button onclick="actualizarEstado(${actividad.id}, '${actividad.estado}')" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-400">Actualizar Estado</button>
                                <button onclick="eliminarActividad(${actividad.id})" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-400">Eliminar</button>
                            </div>
                        `;

                        listaActividades.appendChild(li);
                    });
                });
        }

        // Crear una nueva actividad
        document.getElementById('formActividad').addEventListener('submit', function (event) {
            event.preventDefault();

            const actividad = {
                usuarioId: user.id,
                descripcion: document.getElementById('descripcion').value,
                fechaInicio: document.getElementById('fechaInicio').value,
                estado: 'Activa'
            };

            fetch('https://localhost:7190/api/actividades', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(actividad)
            })
                .then(() => {
                    obtenerActividades();
                    cerrarFormulario();
                });
        });

        // Actualizar estado de la actividad
        function actualizarEstado(id, estadoActual) {
            const nuevoEstado = estadoActual === 'Activa' ? 'Completada' : 'Activa';

            fetch(`https://localhost:7190/api/actividades/${id}/estado`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ estado: nuevoEstado })
            })
                .then(() => {
                    obtenerActividades();
                });
        }

        // Eliminar actividad
        function eliminarActividad(id) {
            fetch(`https://localhost:7190/api/actividades/${id}`, {
                method: 'DELETE'
            })
                .then(() => {
                    obtenerActividades();
                });
        }

        // Cerrar formulario
        function cerrarFormulario() {
            document.getElementById('formularioActividades').style.display = 'none';
        }

        // Mostrar formulario
        function mostrarFormulario() {
            document.getElementById('formularioActividades').style.display = 'block';
        }
    </script>
</body>
</html>
