<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Metas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="bg-green-100 font-sans">

    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-semibold text-green-700">Gestión de Metas</h1>

        <!-- Barra de navegación -->
        <div class="mb-4">
            <nav class="flex items-center space-x-2 text-lg text-gray-700">
                <a href="https://localhost:7190/index.html" class="text-green-600 hover:text-green-500 font-semibold">
                    <i class="fas fa-home mr-2"></i> Dashboard
                </a>
                <span>/</span>
                <span class="text-gray-500" id="pageTitle">Metas</span>
            </nav>
        </div>

        <!-- Botón para abrir el modal de creación -->
        <button onclick="abrirModalCrear()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-500 mt-4">Añadir Dieta</button>

        <!-- Formulario para añadir metas -->
        <div id="modalCrear" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden justify-center items-center">
            <div class="bg-white p-8 rounded shadow-lg w-1/3 h-full overflow-auto">
                <h2 class="text-2xl text-green-700 mb-4">Añadir Dieta</h2>

                <form id="formMeta" class="space-y-4">
                    <div class="mb-4">
                        <label for="descripcion" class="block text-lg text-gray-700">Descripción</label>
                        <input type="text" id="descripcion" class="w-full p-2 mt-2 border border-gray-300 rounded" required>
                    </div>

                    <div class="mb-4">
                        <label for="fechaMeta" class="block text-lg text-gray-700">Fecha de la Meta</label>
                        <input type="date" id="fechaMeta" class="w-full p-2 mt-2 border border-gray-300 rounded" required>
                    </div>

                    <button type="submit" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-500">
                        Añadir Meta
                    </button>
                </form>

                <button onclick="cerrarModalCrear()" class="mt-4 bg-red-500 text-white px-4 py-2 rounded hover:bg-red-400 w-full">
                    Cancelar
                </button>
            </div>
        </div>



        <div class="mt-6">
            <h2 class="text-2xl text-green-700 mb-4">Lista de Metas</h2>
            <ul id="listaMetas" class="space-y-4"></ul>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('usuario'));

        // Verificar si el usuario está logueado
        window.onload = async function () {
            if (!user) {
                window.location.href = 'login.html'; // Si no hay usuario, redirige al login
            } else {
                obtenerMetas(); // Si está logueado, carga las metas
            }
        };

        // Obtener todas las metas
        function obtenerMetas() {
            fetch(`https://localhost:7190/api/metas/usuario/${user.id}`)
                .then(response => response.json())
                .then(data => {
                    const listaMetas = document.getElementById('listaMetas');
                    listaMetas.innerHTML = ''; // Limpiar la lista actual

                    data.forEach(meta => {
                        const li = document.createElement('li');
                        li.classList.add('bg-white', 'p-4', 'rounded', 'shadow', 'flex', 'justify-between', 'items-center');

                        // Definir estilos dinámicos para metas completadas
                        const textoClase = meta.estado === 'Completada' ? 'line-through text-gray-500' : 'text-green-800';

                        li.innerHTML = `
                                <div class="flex items-center space-x-4">
                                    <button
                                        onclick="alternarEstado(${meta.id}, '${meta.estado}')"
                                        class="w-6 h-6 rounded-full border-2 border-green-600 flex items-center justify-center hover:bg-green-600 hover:text-white">
                                        ${meta.estado === 'Completada' ? '✔️' : ''}
                                    </button>
                                    <div>
                                        <p class="text-xl ${textoClase}">${meta.descripcion}</p>
                                        <p class="text-sm text-gray-600">Fecha: ${meta.fechaMeta}</p>
                                    </div>
                                </div>
                                <button onclick="eliminarMeta(${meta.id})" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-400">Eliminar</button>
                            `;

                        listaMetas.appendChild(li);
                    });
                });
        }

        // Crear una nueva meta
        document.getElementById('formMeta').addEventListener('submit', function (event) {
            event.preventDefault();

            const meta = {
                usuarioId: user.id,
                descripcion: document.getElementById('descripcion').value,
                fechaMeta: document.getElementById('fechaMeta').value,
                estado: 'Pendiente'
            };

            fetch('https://localhost:7190/api/metas', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(meta)
            })
                .then(() => {
                    obtenerMetas();
                    cerrarModalCrear();
                });
        });

        // Alternar estado de la meta (Pendiente/Completada)
        function alternarEstado(id, estadoActual) {
            const nuevoEstado = estadoActual === 'Pendiente' ? 'Completada' : 'Pendiente';

            fetch(`https://localhost:7190/api/metas/${id}/estado`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ estado: nuevoEstado })
            })
                .then(() => {
                    obtenerMetas();
                });
        }

        // Eliminar meta
        function eliminarMeta(id) {
            fetch(`https://localhost:7190/api/metas/${id}`, {
                method: 'DELETE'
            })
                .then(() => {
                    obtenerMetas();
                });
        }

        // Limpiar formulario
        function limpiarFormulario() {
            document.getElementById('descripcion').value = '';
            document.getElementById('fechaMeta').value = '';
        }

        function abrirModalCrear() {
            document.getElementById('modalCrear').classList.remove('hidden');
        }

        function cerrarModalCrear() {
            document.getElementById('modalCrear').classList.add('hidden');
            limpiarFormulario();
        }
    </script>
</body>
</html>
