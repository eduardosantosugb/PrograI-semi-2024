<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Metas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-100 font-sans">

    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-semibold text-green-700">Gestión de Metas</h1>

        <!-- Formulario para añadir o editar metas -->
        <form id="formMeta" class="mt-4 p-4 bg-white rounded shadow-lg">
            <input type="hidden" id="metaId">

            <div class="mb-4">
                <label for="descripcion" class="block text-lg text-gray-700">Descripción</label>
                <input type="text" id="descripcion" class="w-full p-2 mt-2 border border-gray-300 rounded" required>
            </div>

            <div class="mb-4">
                <label for="fechaMeta" class="block text-lg text-gray-700">Fecha de la Meta</label>
                <input type="date" id="fechaMeta" class="w-full p-2 mt-2 border border-gray-300 rounded" required>
            </div>

            <div class="mb-4">
                <label for="estado" class="block text-lg text-gray-700">Estado</label>
                <select id="estado" class="w-full p-2 mt-2 border border-gray-300 rounded">
                    <option value="Pendiente">Pendiente</option>
                    <option value="Completada">Completada</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-500">
                Añadir Meta
            </button>
        </form>

        <div class="mt-6">
            <h2 class="text-2xl text-green-700 mb-4">Lista de Metas</h2>
            <ul id="listaMetas" class="space-y-4"></ul>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('usuario'));

        // Verificar si el usuario está logueado
        window.onload = async function () {
            if (!user) {
                window.location.href = 'login.html'; // Si no hay usuario, redirige al login
            } else {
                obtenerMetas(); // Si está logueado, carga las metas
            }
        };

        // Obtener todas las metas
        function obtenerMetas() {
            fetch('https://localhost:7190/api/metas')
                .then(response => response.json())
                .then(data => {
                    const listaMetas = document.getElementById('listaMetas');
                    listaMetas.innerHTML = ''; // Limpiar la lista actual

                    data.forEach(meta => {
                        const li = document.createElement('li');
                        li.classList.add('bg-white', 'p-4', 'rounded', 'shadow');
                        li.innerHTML = `
                                <div class="flex justify-between items-center">
                                    <div>
                                        <p class="text-xl text-green-800">${meta.descripcion}</p>
                                        <p class="text-sm text-gray-600">Fecha: ${meta.fechaMeta}</p>
                                        <p class="text-sm text-gray-600">Estado: ${meta.estado}</p>
                                    </div>
                                    <div class="flex space-x-2">
                                        <button onclick="editarMeta(${meta.id})" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-400">Editar</button>
                                        <button onclick="eliminarMeta(${meta.id})" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-400">Eliminar</button>
                                    </div>
                                </div>
                            `;
                        listaMetas.appendChild(li);
                    });
                });
        }

        // Crear o actualizar una meta
        document.getElementById('formMeta').addEventListener('submit', function (event) {
            event.preventDefault();

            let id = document.getElementById('metaId').value || null;  // Si no hay id, se crea uno nuevo

            const meta = {
                usuarioId: user.id, // Usuario actual
                descripcion: document.getElementById('descripcion').value,
                fechaMeta: document.getElementById('fechaMeta').value,
                estado: document.getElementById('estado').value
            };

            if (id) {
                meta.id = id;
                // Actualizar meta
                fetch(`https://localhost:7190/api/metas/${meta.id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(meta)
                })
                    .then(() => {
                        obtenerMetas();
                        limpiarFormulario();
                    });
            } else {
                // Crear nueva meta (sin id)
                fetch('https://localhost:7190/api/metas', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(meta)
                })
                    .then(() => {
                        obtenerMetas();
                        limpiarFormulario();
                    });
            }
        });

        // Editar meta
        function editarMeta(id) {
            fetch(`https://localhost:7190/api/metas/${id}`)
                .then(response => response.json())
                .then(meta => {
                    document.getElementById('metaId').value = meta.id;
                    document.getElementById('descripcion').value = meta.descripcion;
                    document.getElementById('fechaMeta').value = meta.fechaMeta;
                    document.getElementById('estado').value = meta.estado;
                });
        }

        // Eliminar meta
        function eliminarMeta(id) {
            fetch(`https://localhost:7190/api/metas/${id}`, {
                method: 'DELETE'
            })
                .then(() => {
                    obtenerMetas();
                });
        }

        // Limpiar formulario
        function limpiarFormulario() {
            document.getElementById('metaId').value = '';
            document.getElementById('descripcion').value = '';
            document.getElementById('fechaMeta').value = '';
            document.getElementById('estado').value = 'Pendiente';
        }
    </script>
</body>
</html>
