<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Metas</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.1.2/dist/tailwind.min.js"></script>
</head>
<body class="bg-green-100 font-sans">

    <div id="app" class="container mx-auto p-4">
        <h1 class="text-3xl font-semibold text-green-700">Gestión de Metas</h1>

        <!-- Formulario para añadir o editar metas -->
        <form @submit.prevent="guardarMeta" class="mt-4 p-4 bg-white rounded shadow-lg">
            <input type="hidden" v-model="meta.id">

            <div class="mb-4">
                <label for="descripcion" class="block text-lg text-gray-700">Descripción</label>
                <input type="text" v-model="meta.descripcion" id="descripcion" class="w-full p-2 mt-2 border border-gray-300 rounded" required>
            </div>

            <div class="mb-4">
                <label for="fechaMeta" class="block text-lg text-gray-700">Fecha de la Meta</label>
                <input type="date" v-model="meta.fechaMeta" id="fechaMeta" class="w-full p-2 mt-2 border border-gray-300 rounded" required>
            </div>

            <div class="mb-4">
                <label for="estado" class="block text-lg text-gray-700">Estado</label>
                <select v-model="meta.estado" id="estado" class="w-full p-2 mt-2 border border-gray-300 rounded">
                    <option value="Pendiente">Pendiente</option>
                    <option value="Completada">Completada</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-500">
                {{ meta.id ? 'Actualizar Meta' : 'Añadir Meta' }}
            </button>
        </form>

        <div class="mt-6">
            <h2 class="text-2xl text-green-700 mb-4">Lista de Metas</h2>
            <ul class="space-y-4">
                <li v-for="meta in metas" :key="meta.id" class="bg-white p-4 rounded shadow">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-xl text-green-800">{{ meta.descripcion }}</p>
                            <p class="text-sm text-gray-600">Fecha: {{ meta.fechaMeta }}</p>
                            <p class="text-sm text-gray-600">Estado: {{ meta.estado }}</p>
                        </div>
                        <div class="flex space-x-2">
                            <button @click="editarMeta(meta)" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-400">Editar</button>
                            <button @click="eliminarMeta(meta.id)" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-400">Eliminar</button>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                metas: [],
                meta: {
                    id: null,
                    descripcion: '',
                    fechaMeta: '',
                    estado: 'Pendiente'
                }
            },
            mounted() {
                this.obtenerMetas();
            },
            methods: {
                obtenerMetas() {
                    fetch('/api/metas')
                        .then(response => response.json())
                        .then(data => {
                            this.metas = data;
                        });
                },
                guardarMeta() {
                    if (this.meta.id) {
                        fetch(`/api/metas/${this.meta.id}`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(this.meta)
                        })
                        .then(() => {
                            this.obtenerMetas();
                            this.limpiarFormulario();
                        });
                    } else {
                        fetch('/api/metas', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(this.meta)
                        })
                        .then(() => {
                            this.obtenerMetas();
                            this.limpiarFormulario();
                        });
                    }
                },
                editarMeta(meta) {
                    this.meta = Object.assign({}, meta);
                },
                eliminarMeta(id) {
                    fetch(`/api/metas/${id}`, {
                        method: 'DELETE'
                    })
                    .then(() => {
                        this.obtenerMetas();
                    });
                },
                limpiarFormulario() {
                    this.meta = {
                        id: null,
                        descripcion: '',
                        fechaMeta: '',
                        estado: 'Pendiente'
                    };
                }
            }
        });
    </script>
</body>
</html>
