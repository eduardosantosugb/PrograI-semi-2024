<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-green-700 text-center">Crear una cuenta</h1>
        <form id="registerForm">
            <div class="mb-4">
                <label for="nombre" class="block text-green-600">Nombre</label>
                <input type="text" id="nombre" name="nombre" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="Ingresa tu nombre" required>
            </div>
            <div class="mb-4">
                <label for="email" class="block text-green-600">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="Ingresa tu correo" required>
            </div>
            <div class="mb-4">
                <label for="sexo" class="block text-green-600">Sexo</label>
                <select id="sexo" name="sexo" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400" required>
                    <option value="">Selecciona tu sexo</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                </select>
            </div>
            <div class="mb-4">
                <label for="edad" class="block text-green-600">Edad</label>
                <input type="number" id="edad" name="edad" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="Ingresa tu edad" required>
            </div>
            <div class="mb-4">
                <label for="estatura" class="block text-green-600">Estatura (en cm)</label>
                <input type="number" id="estatura" name="estatura" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="Ingresa tu estatura" required>
            </div>
            <div class="mb-4">
                <label for="contra" class="block text-green-600">Contraseña</label>
                <input type="password" id="contra" name="contra" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="Crea una contraseña" required>
            </div>
            <button type="submit" class="w-full bg-green-500 text-white py-2 rounded-lg hover:bg-green-600 transition">Registrarse</button>
        </form>
        <p class="text-green-600 text-sm mt-4 text-center">
            ¿Ya tienes una cuenta?
            <a href="login.html" class="text-green-500 hover:underline">Iniciar sesión</a>
        </p>
    </div>
    <script>
        window.onload = function () {
            const user = JSON.parse(localStorage.getItem('usuario'));
            if (user) {
                window.location.href = 'index.html'; // Si hay un usuario, redirige al dashboard
            }
        };

        const registerForm = document.getElementById('registerForm');
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const sexo = document.getElementById('sexo').value;
            const edad = document.getElementById('edad').value;
            const estatura = document.getElementById('estatura').value;
            const contra = document.getElementById('contra').value;

            const response = await fetch('/api/Usuarios/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, email, sexo, edad, estatura, contra })
            });

            const data = await response.json();
            if (response.ok) {
                alert(data.message);
                window.location.href = 'login.html';
            } else {
                alert(data.message);
            }
        });
    </script>
</body>
</html>
