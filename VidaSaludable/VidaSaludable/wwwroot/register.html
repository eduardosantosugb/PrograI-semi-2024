<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-700 text-center">Crear una cuenta</h1>
        <form id="registerForm">
            <div class="mb-4">
                <label for="nombre" class="block text-gray-600">Nombre</label>
                <input type="text" id="nombre" name="nombre" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Ingresa tu nombre">
            </div>
            <div class="mb-4">
                <label for="email" class="block text-gray-600">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Ingresa tu correo">
            </div>
            <div class="mb-4">
                <label for="contra" class="block text-gray-600">Contraseña</label>
                <input type="password" id="contra" name="contra" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Crea una contraseña">
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">Registrarse</button>
        </form>
        <p class="text-gray-600 text-sm mt-4 text-center">
            ¿Ya tienes una cuenta?
            <a href="login.html" class="text-blue-500 hover:underline">Iniciar sesión</a>
        </p>
    </div>
    <script>
        const registerForm = document.getElementById('registerForm');
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const contra = document.getElementById('contra').value;

            const response = await fetch('/api/Usuarios/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, email, contra })
            });

            const data = await response.json();
            if (response.ok) {
                alert(data.message);
                window.location.href = 'login.html';
            } else {
                alert(data.message);
            }
        });
    </script>
</body>
</html>
