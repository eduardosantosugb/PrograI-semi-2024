<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Vida Saludable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="bg-gray-100 font-sans antialiased">

    <!-- Contenedor del Dashboard -->
    <div id="dashboard" class="max-w-7xl mx-auto p-8">

        <!-- Título de bienvenida y botón de cerrar sesión -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-green-600">Bienvenido a tu Dashboard, <span id="username" class="font-semibold"></span></h1>
            <button class="bg-red-500 text-white px-6 py-2 rounded-lg shadow-md hover:bg-red-400 transition-all" onclick="logout()">Cerrar sesión</button>
        </div>

        <!-- Cards para acceder a los formularios CRUD con iconos -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Card de Peso -->
            <a href="formularios/peso.html" class="group bg-green-600 text-white border border-gray-300 rounded-lg p-6 shadow-md hover:bg-green-500 transition-all transform hover:scale-105 flex flex-col items-center text-center">
                <i class="fas fa-weight mb-4 text-4xl text-white group-hover:text-green-800 transition-colors"></i>
                <span class="text-lg font-semibold text-white group-hover:text-green-800">Peso</span>
            </a>
            <!-- Card de Dieta -->
            <a href="formularios/dietas.html" class="group bg-green-600 text-white border border-gray-300 rounded-lg p-6 shadow-md hover:bg-green-500 transition-all transform hover:scale-105 flex flex-col items-center text-center">
                <i class="fas fa-apple-alt mb-4 text-4xl text-white group-hover:text-green-800 transition-colors"></i>
                <span class="text-lg font-semibold text-white group-hover:text-green-800">Dieta</span>
            </a>
            <!-- Card de Historial -->
            <a href="formularios/historial.html" class="group bg-green-600 text-white border border-gray-300 rounded-lg p-6 shadow-md hover:bg-green-500 transition-all transform hover:scale-105 flex flex-col items-center text-center">
                <i class="fas fa-history mb-4 text-4xl text-white group-hover:text-green-800 transition-colors"></i>
                <span class="text-lg font-semibold text-white group-hover:text-green-800">Historial de Dietas</span>
            </a>
            <!-- Card de Metas -->
            <a href="formularios/metas.html" class="group bg-green-600 text-white border border-gray-300 rounded-lg p-6 shadow-md hover:bg-green-500 transition-all transform hover:scale-105 flex flex-col items-center text-center">
                <i class="fas fa-bullseye mb-4 text-4xl text-white group-hover:text-green-800 transition-colors"></i>
                <span class="text-lg font-semibold text-white group-hover:text-green-800">Metas</span>
            </a>
            <!-- Card de Actividades -->
            <a href="formularios/actividades.html" class="group bg-green-600 text-white border border-gray-300 rounded-lg p-6 shadow-md hover:bg-green-500 transition-all transform hover:scale-105 flex flex-col items-center text-center">
                <i class="fas fa-running mb-4 text-4xl text-white group-hover:text-green-800 transition-colors"></i>
                <span class="text-lg font-semibold text-white group-hover:text-green-800">Actividades</span>
            </a>
        </div>
    </div>

    <script>
        // Verifica si el usuario está autenticado
        window.onload = function () {
            const user = JSON.parse(localStorage.getItem('usuario'));
            if (!user) {
                window.location.href = 'login.html'; // Si no hay usuario, redirige al login
            } else {
                document.getElementById('username').textContent = user.nombre || 'Usuario'; // Muestra el nombre del usuario
            }
        };

        // Función para cerrar sesión
        function logout() {
            localStorage.removeItem('usuario'); // Elimina al usuario del localStorage
            window.location.href = 'login.html'; // Redirige al login
        }
    </script>

</body>
</html>
