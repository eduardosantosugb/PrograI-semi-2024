<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Vida Saludable</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <!-- Contenedor del Dashboard -->
    <div id="dashboard" class="max-w-7xl mx-auto p-8">
        <!-- Título de bienvenida y botón de cerrar sesión -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-green-600">Bienvenido a tu Dashboard, <span id="username" class="font-semibold"></span></h1>
            <button class="bg-red-500 text-white px-6 py-2 rounded-lg shadow-md hover:bg-red-400 transition-all" onclick="logout()">Cerrar sesión</button>
        </div>

        <!-- Botones para acceder a los formularios CRUD -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <button class="bg-green-600 text-white px-6 py-3 rounded-lg shadow-md hover:bg-green-500 transition-all transform hover:scale-105" onclick="window.location.href='formularios/peso.html'">Formulario de Peso</button>
            <button class="bg-blue-600 text-white px-6 py-3 rounded-lg shadow-md hover:bg-blue-500 transition-all transform hover:scale-105" onclick="window.location.href='formularios/dietas.html'">Formulario de Dieta</button>
            <button class="bg-yellow-600 text-white px-6 py-3 rounded-lg shadow-md hover:bg-yellow-500 transition-all transform hover:scale-105" onclick="window.location.href='formularios/historial.html'">Historial de Dietas</button>
            <button class="bg-purple-600 text-white px-6 py-3 rounded-lg shadow-md hover:bg-purple-500 transition-all transform hover:scale-105" onclick="window.location.href='formularios/metas.html'">Metas</button>
            <button class="bg-red-600 text-white px-6 py-3 rounded-lg shadow-md hover:bg-red-500 transition-all transform hover:scale-105" onclick="window.location.href='formularios/actividades.html'">Actividades</button>
        </div>
    </div>

    <script>
        // Verifica si el usuario está autenticado
        window.onload = function () {
            const user = JSON.parse(localStorage.getItem('usuario'));
            if (!user) {
                window.location.href = 'login.html'; // Si no hay usuario, redirige al login
            } else {
                document.getElementById('username').textContent = user.nombre || 'Usuario'; // Muestra el nombre del usuario
            }
        };

        // Función para cerrar sesión
        function logout() {
            localStorage.removeItem('usuario'); // Elimina al usuario del localStorage
            window.location.href = 'login.html'; // Redirige al login
        }
    </script>

</body>
</html>
