
<!DOCTYPE html>
<html>
<head>
    <title>Vida Saludable</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #006400;
            text-align: center;
        }

        form {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #006400;
            color: white;
            border: none;
            cursor: pointer;
        }

            button:hover {
                background-color: #004d00;
            }

        h2 {
            color: #006400;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table, th, td {
            border: 1px solid #ccc;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #006400;
            color: white;
        }

        .hidden {
            display: none;
        }

        #search {
            padding: 10px;
            width: calc(100% - 22px);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Vida Saludable</h1>
    <form id="healthForm">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="age">Edad:</label>
        <input type="number" id="age" name="age" min="0" required><br><br>

        <label for="height">Estatura (cm):</label>
        <input type="number" id="height" name="height" min="0" required><br><br>

        <label for="weight">Peso (kg):</label>
        <input type="number" id="weight" name="weight" min="0" required><br><br>

        <label for="gender">Género:</label>
        <select id="gender" name="gender">
            <option value="male">Masculino</option>
            <option value="female">Femenino</option>
        </select><br><br>

        <button type="button" onclick="showWeightQuestionnaire()">Siguiente</button>
    </form>

    <div id="weightQuestionnaire" class="hidden">
        <h2>Cuestionario de Peso Saludable</h2>
        <p>¿Estás en un peso saludable?</p>
        <button onclick="handleWeightResponse('sí')">Sí</button>
        <button onclick="handleWeightResponse('no')">No</button>
    </div>

    <div id="followUpQuestionnaire" class="hidden">
        <h2>Cuestionario de Estado de Peso</h2>
        <p>¿Estás en bajo peso, sobrepeso u obesidad?</p>
        <button onclick="handleFollowUpResponse('bajo peso')">Bajo Peso</button>
        <button onclick="handleFollowUpResponse('sobrepeso')">Sobrepeso</button>
        <button onclick="handleFollowUpResponse('obesidad')">Obesidad</button>
    </div>

    <h2>Datos Guardados</h2>
    <input type="text" id="search" placeholder="Buscar por nombre..." onkeyup="searchData()">
    <table id="dataTable">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Estatura</th>
                <th>Peso</th>
                <th>Género</th>
                <th>IMC</th>
                <th>Resultado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="dataBody"></tbody>
    </table>

    <button onclick="closeApplication()">Salir</button>

    <p id="result"></p>

    <script>
        var data = [];

        function calculateHealth() {
            var age = document.getElementById('age').value;
            var height = document.getElementById('height').value;
            var weight = document.getElementById('weight').value;
            var gender = document.getElementById('gender').value;

            var bmi = weight / ((height / 100) * (height / 100));
            var result = '';

            if (bmi < 18.5) {
                result = 'Bajo peso';
            } else if (bmi >= 18.5 && bmi < 24.9) {
                result = 'Peso saludable';
            } else if (bmi >= 25 && bmi < 29.9) {
                result = 'Sobrepeso';
            } else {
                result = 'Obesidad';
            }

            document.getElementById('result').innerText = 'IMC: ' + bmi.toFixed(2) + ' - ' + result;
            return { bmi: bmi.toFixed(2), result: result };
        }

        function saveData() {
            var name = document.getElementById('name').value;
            var age = document.getElementById('age').value;
            var height = document.getElementById('height').value;
            var weight = document.getElementById('weight').value;
            var gender = document.getElementById('gender').value;
            var health = calculateHealth();

            data.push({
                name: name,
                age: age,
                height: height,
                weight: weight,
                gender: gender === 'male' ? 'Masculino' : 'Femenino',
                bmi: health.bmi,
                result: health.result
            });

            renderTable();
            clearForm();
        }

        function clearForm() {
            document.getElementById('healthForm').reset();
            document.getElementById('result').innerText = '';
        }

        function renderTable() {
            var dataBody = document.getElementById('dataBody');
            dataBody.innerHTML = '';

            data.forEach(function(item, index) {
                var row = document.createElement('tr');
                row.innerHTML = '<td>' + item.name + '</td>' +
                                '<td>' + item.age + '</td>' +
                                '<td>' + item.height + '</td>' +
                                '<td>' + item.weight + '</td>' +
                                '<td>' + item.gender + '</td>' +
                                '<td>' + item.bmi + '</td>' +
                                '<td>' + item.result + '</td>' +
                                '<td><button onclick="confirmDelete(' + index + ')">Eliminar</button></td>';
                dataBody.appendChild(row);
            });
        }

        function confirmDelete(index) {
            var confirm1 = confirm("¿Estás seguro de que quieres eliminar este registro?");
            if (confirm1) {
                var confirm2 = confirm("¿Realmente estás seguro?");
                if (confirm2) {
                    deleteData(index);
                }
            }
        }

        function deleteData(index) {
            data.splice(index, 1);
            renderTable();
        }

        function searchData() {
            var query = document.getElementById('search').value.toLowerCase();
            var dataBody = document.getElementById('dataBody');
            dataBody.innerHTML = '';

            data.filter(function(item) {
                return item.name.toLowerCase().includes(query);
            }).forEach(function(item, index) {
                var row = document.createElement('tr');
                row.innerHTML = '<td>' + item.name + '</td>' +
                                '<td>' + item.age + '</td>' +
                                '<td>' + item.height + '</td>' +
                                '<td>' + item.weight + '</td>' +
                                '<td>' + item.gender + '</td>' +
                                '<td>' + item.bmi + '</td>' +
                                '<td>' + item.result + '</td>' +
                                '<td><button onclick="confirmDelete(' + index + ')">Eliminar</button></td>';
                dataBody.appendChild(row);
            });
        }

        function showWeightQuestionnaire() {
            document.getElementById('healthForm').classList.add('hidden');
            document.getElementById('weightQuestionnaire').classList.remove('hidden');
        }

        function handleWeightResponse(response) {
    if (response === 'sí') {
        alert('¡Genial! Sigue manteniendo un estilo de vida saludable.');
        document.getElementById('followUpQuestionnaire').classList.add('hidden');
    } else {
        document.getElementById('followUpQuestionnaire').classList.remove('hidden');
    }
}

function handleFollowUpResponse(response) {
    let message = '';
    switch (response) {
        case 'bajo peso':
            message = 'Te recomendamos aumentar tu ingesta calórica con una dieta rica en nutrientes. ¡Sigue adelante, puedes lograrlo!';
            break;
        case 'sobrepeso':
            message = 'Te recomendamos una dieta balanceada y ejercicio regular para alcanzar un peso saludable. ¡Sigue adelante, puedes lograrlo!';
            break;
        case 'obesidad':
            message = 'Te recomendamos consultar a un profesional de la salud para un plan personalizado. ¡Sigue adelante, puedes lograrlo!';
            break;
    }
    alert(message);
    document.getElementById('followUpQuestionnaire').classList.add('hidden');
}

function closeApplication() {
    window.close();
}
    </script>
</body>
</html>
